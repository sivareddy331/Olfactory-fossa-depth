name: Android Appium E2E Tests

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Appium Dependencies
        working-directory: mobile-automation
        run: npm install

      - name: Run Appium Tests
        working-directory: mobile-automation
        run: npm test || echo "Tests completed with some failures"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: mobile-e2e-report
          path: mobile-automation/allure-results
