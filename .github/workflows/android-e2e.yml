name: Android Appium E2E Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: macos-latest # Required for hardware acceleration for Android emulators on GitHub Actions
    steps:
      - uses: actions/checkout@v3
      
      - name: set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Appium Dependencies
        working-directory: mobile-automation
        run: npm install
        
      - name: Build Android APK
        working-directory: OLfactory
        run: ./gradlew assembleDebug

      - name: Run Appium Tests in Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86
          profile: Nexus 6
          script: |
            cd mobile-automation
            npm test

      - name: Generate Allure Report
        if: always()
        working-directory: mobile-automation
        run: npm run report || echo "Skipping local open"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: mobile-e2e-report
          path: mobile-automation/allure-results
